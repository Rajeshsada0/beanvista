name: icafe_app
description: iCafe — Modern Cafe Management App for Android & iOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.0

  # HTTP Client
  http: ^1.2.1
  dio: ^5.4.3+1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Charts
  fl_chart: ^0.67.0

  # Image Handling
  cached_network_image: ^3.3.1

  # Typography
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0

  # UI
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  local_auth: ^2.2.0
  url_launcher: ^6.2.5
  font_awesome_flutter: ^10.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/beanvistapos.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/beanvistapos.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/beanvistapos.png"
    background_color: "#FFFFFF"
    theme_color: "#1A6B3A"
